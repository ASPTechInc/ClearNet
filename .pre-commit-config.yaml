# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: flutter-import-sorter
        name: Flutter import sorter
        entry: dart run import_sorter:main
        language: system
        files: \.dart$
        pass_filenames: false
      - id: dart-format
        name: Dart format
        entry: dart format
        language: system
        files: \.dart$

