# This workflow is currently disabled in GitHub Actions
#
name: FOSS Compliance Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, to catch changes in upstream dependencies
    - cron: "0 0 * * 0"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Java Development Kit Environment
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Project Flutter Package Dependencies
        run: flutter pub get

      - name: Generate Android Gradle Wrapper
        run: flutter build apk --config-only

      - name: Run FOSS audit script
        run: ./scripts/foss_audit.sh

      - name: Check REUSE licensing compliance
        run: pipx run reuse lint

      - name: Lint F-Droid metadata
        run: |
          pipx install fdroidserver
          # fdroid lint validates Categories against fdroiddata's list, so fetch it
          mkdir -p fdroid-lint/config fdroid-lint/metadata
          curl -sfL https://gitlab.com/fdroid/fdroiddata/-/raw/master/config/categories.yml \
            | grep -vE '^\s+icon:' > fdroid-lint/config/categories.yml
          cp metadata/com.asptechinc.clearnet.yml fdroid-lint/metadata/
          cd fdroid-lint && fdroid lint com.asptechinc.clearnet
