# This workflow is currently disabled in GitHub Actions
#
name: FOSS Compliance Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run periodically every week to check for upstream transient dependency shifts
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Java Development Kit Environment
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Flutter Package Dependencies
        run: flutter pub get

      - name: Execute FOSS Compliance Automated Audit Script
        run: ./scripts/foss_audit.sh
