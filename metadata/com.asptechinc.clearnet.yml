Categories:
  - Internet
  - Security
License: MIT
AuthorName: ASPTechnologies Incorporation
SourceCode: https://github.com/asptechinc/clearnet
IssueTracker: https://github.com/asptechinc/clearnet/issues
Changelog: https://github.com/asptechinc/clearnet/blob/HEAD/CHANGELOG.md
Donate: https://buymeacoffee.com/asptechinc

AutoName: ClearNet
# Summary, description, screenshots and changelogs are read from
# fastlane/metadata/android/ in the source repository.

RepoType: git
Repo: https://github.com/asptechinc/clearnet.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --build-name=$$VERSION$$ --build-number=$$VERCODE$$
        --dart-define=FDROID_BUILD=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
